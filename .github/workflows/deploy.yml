# Deploy to the DigitalOcean droplet. Runs on every push to main, or by hand from
# Actions › Deploy › Run workflow. Setup and the list of secrets: docs/DEPLOY.md
# (in connect-crm).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and release admin
    runs-on: ubuntu-latest
    env:
      APP: admin
      SITE: ${{ vars.SITE_DOMAIN || ':8081' }}
      # JSH's Supabase project. The publishable key is public by design: it ships in every
      # browser and phone build and row-level security protects the data. Repository
      # variables SUPABASE_URL / SUPABASE_ANON_KEY override these (e.g. for a staging project).
      # Never put the secret (sb_secret_… / service_role) key here or anywhere in the apps.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://qenubcnvjcmsxhmehvat.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_EfX8-WUrsYuSkUB4vAFAIQ_ukUY01jy' }}
      NEXT_PUBLIC_CENTER_SLUG: ${{ vars.CENTER_SLUG || 'jsh' }}
    steps:
      - name: Check settings
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DROPLET_HOST"
          [ -n "$KEY" ]  || missing="$missing DROPLET_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Not set in Settings › Secrets and variables › Actions › Secrets:$missing (see docs/DEPLOY.md in connect-crm)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Package
        run: |
          mkdir -p out
          cp -r .next/standalone/. out/
          mkdir -p out/.next && cp -r .next/static out/.next/static
          if [ -d public ]; then cp -r public out/public; fi
          tar -czf "connect-$APP-$GITHUB_SHA.tgz" -C out .
      - name: Release on the droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_() { ssh -i ~/.ssh/deploy -o BatchMode=yes "root@$HOST" "$@"; }
          # Its own upload directory: connect-crm deploys at the same time into /tmp/connect-deploy.
          dir=/tmp/connect-deploy-$APP
          ssh_ "mkdir -p $dir"
          # e-https-admin: the Caddy site generator (a copy of connect-crm's) travels with release.sh.
          scp -i ~/.ssh/deploy -o BatchMode=yes deploy/droplet-setup.sh deploy/release.sh deploy/caddy-sites.mjs "root@$HOST:$dir/"
          scp -i ~/.ssh/deploy -o BatchMode=yes "connect-$APP-$GITHUB_SHA.tgz" "root@$HOST:/tmp/"
          # PORTAL_HTTPS=1: join the portal's HTTPS on this app's own port (8444) once connect-crm
          # has set it up; until then nothing changes (docs/DEPLOY.md in connect-crm, "HTTPS for
          # the event-day app"). http://<droplet IP>:8081 keeps working either way.
          set -o pipefail   # a failed release must fail this step through the tee below
          ssh_ "bash $dir/droplet-setup.sh && PORTAL_HTTPS=1 bash $dir/release.sh $APP $GITHUB_SHA node 3001 '$SITE'" | tee release.log
          echo "### Released $APP" >> "$GITHUB_STEP_SUMMARY"
          https_port=$(sed -n 's/.* on HTTPS port \([0-9]*\).*/\1/p' release.log | tail -1)
          if [[ "$SITE" == :* ]]; then
            port=${SITE#:}
            if [ "$port" = 80 ]; then echo "Open http://$HOST" >> "$GITHUB_STEP_SUMMARY"; else echo "Open http://$HOST:$port" >> "$GITHUB_STEP_SUMMARY"; fi
          else
            echo "Open https://$SITE" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$https_port" ]; then
            echo "HTTPS: https://$HOST:$https_port and https://<portal domain>:$https_port (http:// sends there once the portal's HTTPS check confirms a name)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "HTTPS for this app is not set up yet: see the release log (it starts after connect-crm's HTTPS is set up)" >> "$GITHUB_STEP_SUMMARY"
          fi
